[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquafieldinr"
version = "2.1.3"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "torch>=2.2"]

[project.scripts]
aquafieldinr = "aquafieldinr.cli:main"

[tool.setuptools.packages.find]
include = ["aquafieldinr*"]
